<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>역사 RPG — 시간 여행자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Do+Hyeon&family=Press+Start+2P&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--f:'Do Hyeon','Galmuri11','Noto Sans KR',sans-serif;--t:'Black Han Sans','Do Hyeon',sans-serif;--n:'Press Start 2P',monospace;--k:#16101a;--p1:#f6eedb;--p2:#e2d4b2;--b1:#4a5a86;--b2:#2c3658}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;background:#0b0a12;overflow:hidden;font-family:var(--f);color:#2a2230;-webkit-user-select:none;user-select:none;font-size:12px}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}#cv{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
canvas{image-rendering:pixelated}
/* 도트 프레임: 바깥 검정 1px + 안쪽 밝은/어두운 테두리 */
.pf{background:var(--p1);border:2px solid var(--k);box-shadow:inset 2px 2px 0 #fffaf0,inset -2px -2px 0 var(--p2)}
.btn{font:12px var(--f);border:2px solid var(--k);padding:5px 12px;background:#f4ecd8;color:#2a2230;cursor:pointer;box-shadow:inset 2px 2px 0 #fff,inset -2px -2px 0 #c9b88c}
.btn:hover{background:#fff6e0}.btn:active{box-shadow:inset 2px 2px 0 #c9b88c,inset -2px -2px 0 #fff;transform:translateY(1px)}
.btn.main{background:#ffb935;color:#fff;text-shadow:1px 1px 0 #8a4a00;box-shadow:inset 2px 2px 0 #ffe08a,inset -2px -2px 0 #c9780a}
.btn.sm{font-size:11px;padding:3px 8px}.btn:disabled{opacity:.45;cursor:default}.btn.big{font-size:14px;padding:9px 16px;margin:5px 0;width:100%}
/* 하단 상태바 */
#hud{position:fixed;left:0;right:0;bottom:0;display:none;flex-direction:column;pointer-events:none;z-index:10}
.exw{height:12px;background:#000;position:relative;pointer-events:auto;border-top:2px solid var(--k)}#exb{position:absolute;left:0;top:0;bottom:0;background:#c8e03a;box-shadow:inset 0 2px 0 #f4ffa0,inset 0 -2px 0 #8aa010}#ext{position:absolute;inset:0;text-align:center;font:10px/12px var(--f);color:#fff;text-shadow:1px 1px 0 #000}
#hud .bar1{display:flex;gap:6px;align-items:stretch;justify-content:center;padding:5px 8px;background:#3a4466;border-top:2px solid var(--k);box-shadow:inset 0 2px 0 #6a78a8,inset 0 -2px 0 #232a44;pointer-events:auto;flex-wrap:wrap}
#lvt{display:flex;align-items:center;gap:6px;min-width:140px;background:#232a44;border:2px solid var(--k);padding:2px 8px;box-shadow:inset 2px 2px 0 #151a2c}#lvt b{font:14px var(--f);color:#ffd84d;text-shadow:1px 1px 0 #000;font-weight:400}#lvt span{color:#fff;font-size:12px;line-height:1.2;text-shadow:1px 1px 0 #000}#lvt small{display:block;color:#9ad0ff;font-size:10px}
.gauges{display:flex;flex-direction:column;gap:3px;justify-content:center}
.gb{position:relative;width:190px;height:14px;background:#000;border:2px solid var(--k)}.gb i{position:absolute;left:0;top:0;bottom:0;transition:width .2s}.gb span{position:absolute;inset:0;text-align:center;font:10px/10px var(--f);color:#fff;text-shadow:1px 1px 0 #000;padding-top:1px}
.gb em{position:absolute;left:-1px;top:-1px;bottom:-1px;width:22px;background:var(--k);color:#fff;font:9px/12px var(--f);font-style:normal;text-align:center;z-index:2}
#hpb{left:22px!important;background:#e8323a;box-shadow:inset 0 2px 0 #ff9a9a,inset 0 -2px 0 #9a1020}#mpb{left:22px!important;background:#2a8cf0;box-shadow:inset 0 2px 0 #9ad8ff,inset 0 -2px 0 #1050a8}
.qs-wrap{display:grid;grid-template-columns:repeat(10,36px);gap:2px;background:#232a44;border:2px solid var(--k);padding:2px}
.slot{position:relative;width:36px;height:34px;border:2px solid var(--k);background:#4a5478;box-shadow:inset 2px 2px 0 #2a3150;display:flex;align-items:center;justify-content:center;font-size:17px;color:#fff;cursor:pointer;overflow:hidden}.slot b{font-weight:400}.slot em{position:absolute;left:1px;top:-1px;font:9px var(--f);color:#ffe066;font-style:normal;text-shadow:1px 1px 0 #000}.slot small{position:absolute;right:1px;bottom:-1px;font:9px var(--f);text-shadow:1px 1px 0 #000}.slot i{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.7)}.slot.lock{opacity:.35}
.menus{display:grid;grid-template-columns:repeat(5,auto);gap:2px}
.mb{font:11px var(--f);padding:3px 7px;border:2px solid var(--k);background:#5a6898;color:#fff;cursor:pointer;position:relative;text-shadow:1px 1px 0 #000;box-shadow:inset 2px 2px 0 #8a98c8,inset -2px -2px 0 #3a4670}.mb:hover{background:#6a78a8}.mb .dot{position:absolute;right:-3px;top:-3px;width:8px;height:8px;background:#ff4040;border:2px solid var(--k);display:none}
/* 미니맵 */
#mini{position:fixed;left:8px;top:8px;z-index:9;width:236px;background:#1c2440;border:2px solid var(--k);box-shadow:inset 2px 2px 0 #3a4878,0 0 0 2px #8a9ac8;display:none;pointer-events:none}
#mini .mt{background:#2c3a6a;color:#fff;font:11px var(--f);padding:3px 6px;display:flex;justify-content:space-between;text-shadow:1px 1px 0 #000;border-bottom:2px solid var(--k)}#mini .mt small{color:#9ad0ff;font-size:9px}#mm{display:block;width:232px;height:62px}
#coin{position:fixed;right:8px;top:8px;z-index:9;font:12px var(--f);color:#fff;background:#1c2440;border:2px solid var(--k);box-shadow:0 0 0 2px #8a9ac8;padding:4px 10px;text-shadow:1px 1px 0 #000;display:none}
/* 시스템 메시지 */
#log{position:fixed;left:8px;bottom:78px;z-index:9;width:250px;display:none;flex-direction:column;gap:1px;pointer-events:none}#log div{font:11px var(--f);color:#fff;text-shadow:1px 1px 0 #000,-1px 0 0 #000,0 -1px 0 #000;background:rgba(0,0,0,.35);padding:1px 6px;animation:fo 6s forwards}@keyframes fo{0%,80%{opacity:1}100%{opacity:0}}
#party{position:fixed;left:8px;top:112px;z-index:9;width:200px;background:#1c2440;border:2px solid var(--k);box-shadow:0 0 0 2px #8a9ac8;display:none}#party .mt{background:#6a4a20;color:#fff;font:11px var(--f);padding:3px 6px;display:flex;justify-content:space-between;align-items:center;text-shadow:1px 1px 0 #000;border-bottom:2px solid var(--k)}#party .mt button{font:10px var(--f);border:1px solid #000;background:#f4ecd8;cursor:pointer;padding:0 4px}
.pm{position:relative;padding:3px 6px 8px;color:#fff;font:11px var(--f);text-shadow:1px 1px 0 #000;border-bottom:1px solid #000}.pm i{position:absolute;left:6px;bottom:3px;height:3px;background:#e8323a;max-width:calc(100% - 12px)}.pm small{float:right;color:#9ad0ff;font-size:9px}
#bqbtn{position:fixed;right:8px;top:72px;z-index:9;display:none;font:14px var(--t);border:2px solid var(--k);background:#ffb935;color:#fff;padding:5px 10px;cursor:pointer;box-shadow:0 0 0 2px #fff3c4;text-shadow:1px 1px 0 #8a4a00;animation:bq 1s steps(2) infinite}@keyframes bq{50%{transform:translateY(-2px)}}.streak{text-align:center;font:14px var(--t);color:#e8501a;margin:2px 0}
#chatbox{position:fixed;left:8px;bottom:58px;z-index:12;display:none;width:300px}#chatin{width:100%;font:12px var(--f);border:2px solid var(--k);padding:5px 8px;background:#fff;box-shadow:inset 2px 2px 0 #e6dcc4;outline:none}
#chatbtn{position:fixed;right:8px;top:40px;z-index:9;font:14px var(--f);border:2px solid var(--k);background:#1c2440;color:#fff;padding:3px 8px;cursor:pointer;box-shadow:0 0 0 2px #8a9ac8}
#toasts{position:fixed;top:96px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:3px;align-items:center;pointer-events:none}.toast{background:#1c2440;border:2px solid var(--k);box-shadow:0 0 0 2px #8a9ac8;color:#fff;font:12px var(--f);padding:5px 14px;text-shadow:1px 1px 0 #000;animation:tin .15s steps(2)}@keyframes tin{from{transform:translateY(-6px);opacity:0}}
/* 창 */
#modal{position:fixed;inset:0;background:rgba(5,6,14,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
.mbox{background:var(--p1);border:2px solid var(--k);padding:0 14px 12px;max-width:620px;width:100%;max-height:92vh;overflow:auto;box-shadow:inset 2px 2px 0 #fffaf0,inset -2px -2px 0 var(--p2),0 0 0 2px #8a9ac8,0 0 0 4px var(--k),6px 6px 0 4px rgba(0,0,0,.35);animation:pop .12s steps(2)}@keyframes pop{from{transform:scale(.95);opacity:0}}
.mbox h2{font:13px var(--f);font-weight:400;margin:0 -14px 10px;padding:7px 12px;background:var(--b1);color:#fff;text-shadow:1px 1px 0 #000;border-bottom:2px solid var(--k);box-shadow:inset 0 2px 0 #7a8ac0,inset 0 -2px 0 var(--b2)}.mbox h2 small{font-size:11px;color:#c8d6ff}
.mbox::-webkit-scrollbar{width:10px}.mbox::-webkit-scrollbar-thumb{background:#8a9ac8;border:2px solid var(--k)}
.sub{font-size:11px;color:#6b6070;text-align:center;margin:5px 0}.row{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.qcard{background:#fff;border:2px solid var(--k);padding:10px;margin:8px 0;box-shadow:inset 2px 2px 0 #eee4cc}.qtag{display:inline-block;background:#ffd062;border:2px solid var(--k);padding:0 7px;font:11px var(--f)}.qtext{font:15px var(--f);margin-top:8px;line-height:1.6}
.opts{display:grid;gap:5px}.opt{display:flex;gap:8px;align-items:center;text-align:left;font:13px var(--f);background:#fff;border:2px solid var(--k);padding:7px 9px;cursor:pointer;color:#2a2230;box-shadow:inset -2px -2px 0 #ddd0b0}.opt:hover{background:#fff6d8}.opt b{background:#ffb935;color:#fff;border:2px solid var(--k);width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:11px;font-weight:400;text-shadow:1px 1px 0 #8a4a00}.opt.ok{background:#d0f6c8}.opt.no{background:#ffd0d0}.opt:disabled{cursor:default}
.res{border:2px solid var(--k);padding:7px 10px;margin-top:8px;font-size:12px;line-height:1.7}.res.ok{background:#e2fadc}.res.no{background:#ffe8e8}
.npc{display:flex;gap:12px;align-items:flex-start}.npc canvas{flex:none;background:#bfe0ff;border:2px solid var(--k);box-shadow:inset 0 -24px 0 #a8d870}.npc p{line-height:1.8;margin:4px 0}
.quest{background:#fff6dc;border:2px dashed #8a6a3a;padding:7px 9px;margin:8px 0;font-size:12px;line-height:1.8}
.story{background:#fff6dc;border:2px solid var(--k);padding:9px;font:13px var(--f);margin:8px 0;line-height:1.7}.big{font:13px var(--f);text-align:center;margin:8px 0;line-height:1.7}
.shop{display:grid;gap:4px}.si{display:flex;gap:8px;align-items:center;background:#fff;border:2px solid var(--k);padding:5px 8px}.si span{font-size:22px}.si b{font-size:12px;font-weight:400}.si small{flex:1;color:#8a8090;font-size:10px}
.eqgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.eqs{background:#fff;border:2px solid var(--k);padding:4px;text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center}.eqs span{font-size:22px}.eqs b{font-size:10px;font-weight:400}.eqs small{font-size:9px;color:#8a8090}
.invgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;margin-top:6px;background:#3a4466;padding:4px;border:2px solid var(--k)}.iv{aspect-ratio:1;border:2px solid var(--k);background:#f4ecd8;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;box-shadow:inset 2px 2px 0 #fff}.iv span{font-size:18px}.iv small{font-size:8px;white-space:nowrap}.iv.empty{background:#2a3150;box-shadow:inset 2px 2px 0 #1a2038;cursor:default}.iv.star2{background:#dcecff}.iv.star3{background:#fff0a0}
.iv.leg{background:linear-gradient(135deg,#fff3a0,#ffb0e0,#a8d8ff);box-shadow:inset 0 0 0 2px #ff9a00}
.etcgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin:6px 0}.ec{position:relative;background:#fff;border:2px solid var(--k);padding:3px;text-align:center}.ec span{font-size:18px;display:block}.ec small{font-size:8px;display:block;white-space:nowrap;overflow:hidden}.ec b{position:absolute;right:2px;top:0;font:10px var(--f);color:#c45a10;font-weight:400}
.qrow{display:flex;gap:8px;align-items:center;justify-content:space-between;background:#fff;border:2px solid var(--k);padding:6px 9px;margin:4px 0}.qrow>div{flex:1}.qrow b{display:block;font-family:var(--t);font-weight:400;font-size:14px}.qrow small{color:#6b6070;font-size:12px}.qrow p{font-size:13px;line-height:1.6;margin:3px 0;color:#3a3040}.qrow .rw{color:#a85a00}.qrow.qd{opacity:.5}.qh{font:15px var(--t);margin:10px 0 4px}
.iv.sel{outline:3px solid #ff9a00;outline-offset:-3px}.ec.qi{background:#fff8dc}.mbox.enh-ok{box-shadow:0 0 0 4px #ffd84d,0 0 40px #ffd84d}.mbox.enh-boom{box-shadow:0 0 0 4px #ff4040,0 0 40px #ff4040}.mbox label{font-size:13px;cursor:pointer}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px}.krow{display:flex;justify-content:space-between;align-items:center;background:#fff;border:2px solid var(--k);padding:4px 8px;font-size:14px}.krow .btn{min-width:90px;font-family:var(--n)!important;font-size:10px}.krow.kw{background:#fff6c4}
.mbox.wide{max-width:900px}.world{display:flex;flex-direction:column;gap:6px}.wr{background:#fff;border:2px solid var(--k);padding:6px 8px}.wr h4{font:15px var(--t);margin-bottom:4px}.wr h4 small{font:11px var(--f);color:#8a8090}.wr.lock{opacity:.55}.wr.lock p{font-size:13px}.wr.hid{background:#efe6ff}
.wline{display:flex;align-items:stretch;gap:0;overflow-x:auto}.wline s{flex:0 0 10px;align-self:center;height:3px;background:#8a6a3a;text-decoration:none}.wn{position:relative;flex:1;min-width:92px;border:2px solid var(--k);padding:4px;text-align:center;background:#eaf7e0}.wn.town{background:#fff3c4}.wn.boss{background:#ffd8d8}.wn i{font-style:normal;font-size:16px;display:block}.wn b{font-size:12px;font-weight:400;display:block;line-height:1.2}.wn small{font:8px var(--n);color:#6b6070}.wn.here{outline:3px solid #ff9a00;outline-offset:-3px;background:#fffbe0}.wn em{position:absolute;top:-10px;left:50%;transform:translateX(-50%);font-style:normal;font-size:10px;background:#ff9a00;color:#fff;padding:0 4px;white-space:nowrap}
.strow{display:flex;gap:8px;align-items:center;background:#fff;border:2px solid var(--k);padding:5px 9px;margin:4px 0}.strow b{font-size:12px;font-weight:400}.strow>span{font-size:15px;min-width:28px;text-align:center}.strow small{color:#8a8090;flex:1;font-size:10px}.lockr{opacity:.5}.qs{font-size:10px;background:#efe8f6;border:1px solid #b8a8c8;padding:1px 5px}
.gates{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:6px}.help p{font-size:12px;line-height:1.9;margin:4px 0}
.jobs{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin-top:8px}.job{font-family:var(--f);text-align:left;background:#fff;border:2px solid var(--k);border-left:8px solid var(--c);padding:7px;cursor:pointer;display:flex;flex-direction:column;gap:3px;color:#2a2230}.job:hover{background:#fff6d8}.job span{font-size:22px}.job b{font-size:13px;color:var(--c);font-weight:400}.job small{font-size:10px;line-height:1.6;color:#5b5068}.job em{font-style:normal;font-size:10px}
/* 타이틀 */
#title{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center}
.tcard{background:var(--p1);border:2px solid var(--k);padding:0 20px 14px;width:min(380px,92vw);text-align:center;box-shadow:inset 2px 2px 0 #fffaf0,inset -2px -2px 0 var(--p2),0 0 0 2px #8a9ac8,0 0 0 4px var(--k),8px 8px 0 4px rgba(0,0,0,.35)}
.logo{font:40px var(--f);color:#ffd84d;text-shadow:2px 0 0 #3a1a00,-2px 0 0 #3a1a00,0 2px 0 #3a1a00,0 -2px 0 #3a1a00,2px 2px 0 #3a1a00,4px 4px 0 #c45a10;margin:-30px 0 4px}.logo span{color:#8fd4ff;text-shadow:2px 0 0 #0a2a4a,-2px 0 0 #0a2a4a,0 2px 0 #0a2a4a,0 -2px 0 #0a2a4a,2px 2px 0 #0a2a4a,4px 4px 0 #1a5aa8}.tsub{font:12px var(--f);margin:4px 0 8px;color:#4b4058}.or{font-size:10px;color:#8a8090}
#prev{display:block;margin:2px auto;background:#bfe0ff;border:2px solid var(--k);box-shadow:inset 0 -26px 0 #a8d870}#nm{font:14px var(--f);text-align:center;border:2px solid var(--k);padding:6px;width:100%;color:#2a2230;background:#fff;margin-top:6px;box-shadow:inset 2px 2px 0 #e6dcc4}
.hairs{display:flex;gap:5px;justify-content:center;margin:8px 0}.hairs button{width:24px;height:24px;border:2px solid var(--k);cursor:pointer;box-shadow:inset 2px 2px 0 rgba(255,255,255,.4)}.hairs .lg{width:auto;font:11px var(--f);padding:0 8px;background:#fff}.tip{font-size:10px;color:#8a8090;margin-top:6px}
#touch{position:fixed;inset:0;pointer-events:none;z-index:11;display:none}#touch div{position:absolute;bottom:110px;display:grid;gap:5px;pointer-events:auto}#touch button{width:54px;height:54px;border:2px solid #fff;background:rgba(20,26,50,.55);color:#fff;font:14px var(--f);touch-action:none}
#tl{left:12px;grid-template-columns:repeat(3,54px)}#tr{right:12px;grid-template-columns:repeat(3,54px)}
@media (max-width:760px){.gb{width:120px}#lvt{min-width:0}.qs-wrap{grid-template-columns:repeat(5,30px)}.slot{width:30px;height:30px;font-size:14px}.eqgrid{grid-template-columns:repeat(3,1fr)}.invgrid{grid-template-columns:repeat(6,1fr)}.jobs{grid-template-columns:1fr}#mini{width:170px}#mm{width:166px;height:44px}#log{display:none!important}}

/* 개성 폰트 */
body{font-size:14px;letter-spacing:.2px}
.mbox h2,.logo,.tsub,.btn.main,.btn.big,#mini .mt span,#party .mt,.qtext,.job b,.story,.big{font-family:var(--t)!important;font-weight:400}
.mbox h2{font-size:17px!important;letter-spacing:.5px}.qtext{font-size:19px!important;line-height:1.5}.logo{font-size:52px!important;letter-spacing:2px}
#lvt b{font:11px var(--n)!important;line-height:16px}.gb span,#ext,.slot em,.slot small,.ec b,#coin{font-family:var(--n)!important;font-size:8px!important;letter-spacing:0}.gb span{line-height:11px!important;padding-top:1px}#ext{line-height:13px!important}.gb em{font:8px/12px var(--n)!important}
#coin{font-size:10px!important;padding:6px 10px}.opt{font-size:15px!important}.opt b{font:9px var(--n)!important}.qtag{font-family:var(--t)!important;font-size:12px!important}
.toast{font-family:var(--t)!important;font-size:14px!important;letter-spacing:.5px}.mb{font-size:13px!important}.btn{font-size:14px}.btn.sm{font-size:12px}
#log div{font-size:13px!important}.sub{font-size:13px!important}.help p,.quest,.res{font-size:14px!important}
